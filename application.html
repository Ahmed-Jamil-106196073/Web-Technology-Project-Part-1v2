<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form | Creative Digital Media Agency</title>
    <link rel="stylesheet" href="style.application.css">
</head>

<body>

<header>
    <h1>Creative Digital Media Agency</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="application.html">Apply Now</a>
    </nav>
</header>

<main class="application-section">

    <h2>Join Our Team</h2>

    <p>Interested in joining our agency? Complete the application form below.</p>

    <form action="#" method="post">

        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required>

        <label for="position">Position Applying For:</label>
        <select id="position" name="position" required>
            <option value="">Select a position</option>
            <option value="web-developer">Web Developer</option>
            <option value="graphic-designer">Graphic Designer</option>
            <option value="digital-marketer">Digital Marketing Specialist</option>
            <option value="content-creator">Content Creator</option>
        </select>

        <label for="skills">Your Skills:</label>
        <textarea id="skills" name="skills" rows="4" required></textarea>

        <label for="experience">Previous Experience:</label>
        <textarea id="experience" name="experience" rows="4"></textarea>

        <label for="motivation">Why Do You Want to Join Us?</label>
        <textarea id="motivation" name="motivation" rows="4" required></textarea>

        <button type="submit">Submit Application</button>

    </form>

</main>

<footer>
    <p>&copy; 2026 Creative Digital Media Agency. All rights reserved.</p>
</footer>

</body>
</html>
